name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Lean install for CI — install heavy deps from requirements minus torch
          pip install numpy pandas pyarrow scipy statsmodels scikit-learn arch xgboost pytest
          # Skip torch / yfinance for CI speed; deep model tests are skipif-gated

      - name: Run smoke tests
        run: |
          python -m pytest tests/ -v --tb=short -x
